name: docs-lint

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'bin/docs-lint'
  pull_request:
    paths:
      - 'docs/**'
      - 'bin/docs-lint'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - run: bin/docs-lint
